# An annotated X.Y.Z tag on main publishes a GitHub release: the checks, notes that open with the tag message,
# a details table with the changes since the previous release, and the full PDF per language attached.
# scripts/release.ts does the work, so it runs the same locally.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the stale PDF check reads the history
          persist-credentials: false

      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # checkout leaves the pushed tag lightweight, fetch the annotated one for its message
      - name: Annotated tag
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # runs scripts/*.ts as they are

      - name: Strings
        run: node scripts/strings.ts

      - name: Notes and PDFs
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release.ts "$TAG" --out "$RUNNER_TEMP/release"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/release/*.pdf \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "system.$TAG" \
            --notes-file "$RUNNER_TEMP/release/notes.md"
